version: "3.8"

services:
  gh2lark:
    build: .
    container_name: gh2lark
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # 仅本地回环，由反向代理暴露 HTTPS
    environment:
      - LARK_WEBHOOK_URL=${LARK_WEBHOOK_URL}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
